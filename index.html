<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>생명을 향한 여정 · 헤브론의료원 20주년</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      background: #0f1a14;
      color: #f4efe0;
      font-family: system-ui, "Noto Sans KR", sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    #game {
      position: relative;
      width: min(100vw, 960px, calc((100vh - 210px) * 2));
      min-width: 320px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #stage {
      position: relative;
      line-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 1;
      image-rendering: pixelated;
      background: #222;
    }
    #stage.danger::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 28px rgba(220, 50, 50, 0.55);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    #hud {
      position: absolute;
      left: 6px;
      top: 6px;
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
      line-height: 1;
      font-size: 12px;
      font-weight: 800;
      z-index: 3;
    }
    .ib, #loc, #snd {
      background: #173d35d9;
      border: 2px solid #4f8f78;
      padding: 4px 7px;
      color: #f4efe0;
    }
    #topR {
      position: absolute;
      right: 6px;
      top: 6px;
      display: flex;
      gap: 5px;
      align-items: center;
      z-index: 3;
    }
    #loc {
      line-height: 1;
      font-size: 11px;
      font-weight: 800;
    }
    #snd {
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }
    .st {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 2px;
      background: #3b5a4c;
    }
    .st.a { background: #f1d18e; }
    .st.d { background: #7fc29b; }
    #bub, #cap {
      position: absolute;
      display: none;
      line-height: 1.45;
      z-index: 5;
      pointer-events: none;
    }
    #bub {
      transform: translate(-50%, -100%);
      max-width: 48%;
      min-width: 100px;
      background: #fff9e9;
      color: #3a3220;
      border: 2px solid #e5c88d;
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 3px 10px #0006;
    }
    #bub:after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: calc(50% + var(--dx, 0px));
      width: 12px;
      height: 12px;
      background: #fff9e9;
      border-right: 2px solid #e5c88d;
      border-bottom: 2px solid #e5c88d;
      transform: translateX(-50%) rotate(45deg);
    }
    #bub b {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #8a754c;
    }
    #cap {
      left: 50%;
      top: 58px;
      transform: translateX(-50%);
      max-width: 86%;
      text-align: center;
      background: #173d35eb;
      border: 2px solid #4f8f78;
      padding: 8px 14px;
      font-size: 13px;
      color: #fff;
      border-radius: 4px;
    }
    #co {
      position: absolute;
      left: 6px;
      top: 33px;
      line-height: 1;
      font-size: 11px;
      font-weight: 700;
      background: #173d35d9;
      border: 2px solid #4f8f78;
      padding: 4px 7px;
      z-index: 3;
    }
    #pad {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
      pointer-events: none;
      z-index: 4;
    }
    #pad div {
      display: flex;
      gap: 6px;
    }
    #pad button {
      pointer-events: auto;
      width: 46px;
      height: 46px;
      font-size: 18px;
      border: 2px solid #4f8f78;
      background: #173d35c8;
      color: #fff;
      opacity: 0.85;
      border-radius: 6px;
    }
    @media (hover: hover) and (pointer: fine) {
      #pad { display: none; }
    }
    #box {
      min-height: 178px;
      padding: 11px 13px;
      background: #1b2c22;
      border: 3px solid #6f8f5f;
      border-top: 0;
      line-height: 1.45;
    }
    #sp {
      font-size: 10px;
      letter-spacing: 0.12em;
      font-weight: 800;
      color: #e5c88d;
    }
    #tt {
      margin: 2px 0;
      font-size: 17px;
    }
    #st2 {
      margin: 0;
      font-size: 12px;
      color: #cfdccf;
    }
    #ch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      margin-top: 9px;
    }
    .c {
      display: flex;
      gap: 8px;
      align-items: center;
      text-align: left;
      font: inherit;
      padding: 8px 10px;
      cursor: pointer;
      color: #49351e;
      border: 2px solid #a87a42;
      background: linear-gradient(145deg, #fff1cf, #e9c58e);
      box-shadow: 0 3px 0 #78512e;
      transition: transform 0.08s;
    }
    .c:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #78512e;
    }
    .c:nth-child(2) {
      background: linear-gradient(145deg, #f6f4d9, #d9dfa7);
      border-color: #87954e;
      box-shadow: 0 3px 0 #66713b;
    }
    .c:nth-child(3) {
      background: linear-gradient(145deg, #f9e8ef, #e5bfd1);
      border-color: #a16d8b;
      box-shadow: 0 3px 0 #754d68;
    }
    .c:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }
    .c .i { font-size: 22px; }
    .c b { display: block; font-size: 13px; }
    .c small { font-size: 11px; color: #5a4b38; }
    #hint {
      margin-top: 9px;
      font-size: 12px;
      font-weight: 700;
      color: #f1d18e;
    }
    #end {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 9;
      overflow: auto;
      background: #13332bf5;
      text-align: center;
      padding: 20px;
      place-items: center;
    }
    #end.show {
      display: grid;
    }
    #end .e { font-size: 48px; }
    #end h2 { font-size: 24px; margin: 6px 0; }
    #end p {
      line-height: 1.65;
      color: #e1eee5;
      max-width: 560px;
      margin: 8px auto;
      font-size: 14px;
    }
    #end blockquote {
      margin: 12px auto;
      max-width: 560px;
      padding: 14px;
      background: #ffffff18;
      border-left: 4px solid #f1d18e;
      font-weight: 800;
      font-size: 14px;
    }
    #stats {
      display: none;
      max-width: 560px;
      margin: 10px auto;
      padding: 10px;
      background: #0e241e;
      border: 1px solid #4f8f78;
      font-size: 12px;
      color: #cfdccf;
      line-height: 1.6;
    }
    #end button {
      border: 0;
      padding: 12px 24px;
      background: #f1d18e;
      color: #1b2c22;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <main id="game">
    <div id="stage">
      <canvas id="cv" width="320" height="160"></canvas>
      <div id="hud">
        <span class="ib">🪙 <b id="m">15</b></span>
        <span class="ib">❤️ <b id="h">5</b></span>
        <span class="ib">🕒 <b id="c">06:00</b></span>
        <span id="steps"></span>
      </div>
      <div id="topR">
        <div id="loc"></div>
        <button id="snd" title="효과음 켜기/끄기">🔊</button>
      </div>
      <div id="bub"></div>
      <div id="cap"></div>
      <div id="co"></div>
      <div id="pad">
        <div>
          <button id="L">◀</button>
          <button id="R">▶</button>
        </div>
        <div>
          <button id="A">✋</button>
        </div>
      </div>
    </div>

    <div id="box">
      <div id="sp"></div>
      <h2 id="tt"></h2>
      <p id="st2"></p>
      <div id="ch"></div>
      <div id="hint"></div>
    </div>

    <div id="end">
      <div>
        <div class="e" id="ee"></div>
        <h2 id="et"></h2>
        <p id="ex"></p>
        <div id="stats"></div>
        <blockquote id="eq"></blockquote>
        <button id="re">처음부터 다시하기</button>
      </div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const g = $('cv').getContext('2d');
    const VW = 320, GY = 122, FY = 140, W = 900, SK = '#f0c6a0';

    const R = (x, y, w, h, c) => {
      g.fillStyle = c;
      g.fillRect(Math.round(x), Math.round(y), w, h);
    };
    const rnd = n => {
      n = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return n - Math.floor(n);
    };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ---------- 레트로 효과음 (Web Audio API) ---------- */
    let ac = null, muted = 0;

    function sfx(type) {
      if (muted) return;
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator();
        const gn = ac.createGain();
        const t = ac.currentTime;
        o.connect(gn);
        gn.connect(ac.destination);

        if (type === 'talk') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(420, t);
          o.frequency.exponentialRampToValueAtTime(560, t + 0.05);
          gn.gain.setValueAtTime(0.06, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          o.start(t);
          o.stop(t + 0.06);
        } else if (type === 'pick') {
          o.type = 'sine';
          o.frequency.setValueAtTime(523, t);
          o.frequency.setValueAtTime(659, t + 0.07);
          gn.gain.setValueAtTime(0.08, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
          o.start(t);
          o.stop(t + 0.16);
        } else if (type === 'warn') {
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(220, t);
          o.frequency.linearRampToValueAtTime(160, t + 0.18);
          gn.gain.setValueAtTime(0.07, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          o.start(t);
          o.stop(t + 0.2);
        } else if (type === 'end') {
          o.type = 'triangle';
          [523, 659, 784, 1046].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * 0.1));
          gn.gain.setValueAtTime(0.08, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          o.start(t);
          o.stop(t + 0.45);
        }
      } catch (e) {}
    }

    $('snd').onclick = () => {
      muted = !muted;
      $('snd').textContent = muted ? '🔇' : '🔊';
    };

    /* ---------- 캐릭터 색상 및 테마 정의 ---------- */
    const ME = { h: '#2a1f2d', t: '#cfe8f3', b: '#4a5675', l: '#e0b898' };
    const TH = [
      { sky: ['#bfe6a6', '#eef2c0'], far: '#a6c98e', ft: '#8fb57c', mid: '#6a9f5c', tr: '#3f6b3d', gr: '#6aa543', dt: '#a98458' },
      { sky: ['#aee0e8', '#f3f0c8'], far: '#9cc79a', ft: '#86b386', mid: '#5f9a64', tr: '#3d6a46', gr: '#78ad4a', dt: '#c4a06a' },
      { sky: ['#8fd0ee', '#e2f1e6'], far: '#a9cfa0', ft: '#93bb8c', mid: '#6fa86a', tr: '#427048', gr: '#7ab552', dt: '#c9b48a' },
      { in: 1, wall: '#e8eee2', wd: '#c4d6c0', fl: '#b9a47c' },
      { in: 1, wall: '#f3ead8', wd: '#d9c9a6', fl: '#c2a77d' }
    ];

    const C = (h, t, b, l) => ({ h, t, b, l });
    const GR = C('#d8d8d8', '#b5653d', '#7a4a2c', '#d9b08c');
    const SO = C('#2a1f1a', '#4f7a5a', '#3c4a3a', '#d9b08c');
    const BA = C('#2b2018', '#c98b3a', '#5a4a2a', '#d9b08c');
    const CH = C('#2a1f1a', '#9a4f8c', '#5a3a5a', '#d9b08c');
    const SE = C('#222', '#7a3a2a', '#3a2a22', '#d9b08c');
    const RI = C('#2a1f1a', '#f2f2f2', '#2f8c82', '#d9b08c');
    const DR = C('#222', '#fff', '#fff', '#4a5675');
    const NU = C('#5a3b2a', '#f6d9e2', '#f6d9e2', '#d9b08c');
    const OL = C('#bbb', '#6b7a8a', '#4a4a4a', '#d9b08c');
    const DA = C('#2a1f2d', '#f2c94c', '#3c5a8a', '#e0b898');
    const BI = C('#2a1f1a', '#6fa8dc', '#4a4a5a', '#d9b08c');

    const NO = label => [label, '시간이 없어요.', '⏭️', 0, 0, 0, '', '인사하고 돌아섭니다.'];

    /* ---------- 시나리오 데이터 ---------- */
    /* 선택지 배열 구조: [제목, 설명, 아이콘, 비용(음수=획득), 시간(분), 다라상태, 플래그, 결과, 이동키, 필요플래그, 재선택여부] */

      {
        loc: '캄보디아 농촌 마을 · 이른 새벽',
        th: 0,
        p: 'v',
        t: '아픈 동생을 병원에 데려가야 해요.',
        s: '마을 사람들에게 다가가 말을 걸어 보세요.',
        n: [
          {
            x: 130,
            n: '할머니',
            c: GR,
            m: 1,
            s: 'g1',
            d: [
              '할머니|마야, 다라가 또 숨을 못 쉬어. 입술까지 파래졌구나.',
              '다라|누나, 뛰지도 않았는데… 가슴이 답답해.',
              'MAYA|(다라의 손을 꼭 잡는다) 할머니, 보건소 소페아 아주머니께 데려갈게요.'
            ]
          },
          {
            x: 560,
            n: '소페아 아주머니',
            c: SO,
            m: 1,
            q: 'g1',
            d: [
              '소페아|이른 새벽에 무슨 일이니, 마야?',
              'MAYA|동생이 숨을 못 쉬어요. 밤새 앓았어요.',
              '소페아|(다라의 가슴에 귀를 댄다) 심장 소리가 좋지 않아. 읍내 보건소 장비로는 부족해.',
              '소페아|프놈펜의 헤브론의료원에 가야 해. 멀지만, 아이 심장을 제대로 봐 줄 수 있는 곳이야.',
              'MAYA|프놈펜까지 가는 길도, 병원비도… 저는 잘 몰라요.'
            ],
            ch: [
              ['길 안내 메모를 받는다', '환승 위치와 병원 약도를 적어요 (🕒+30분)', '📝', 0, 30, 0, 'advice', '메모를 받았어요. 낯선 길에서도 헤매지 않을 거예요.'],
              ['바로 나선다', '1분 1초가 급해요.', '🏃', 0, 0, 0, '', '메모 없이 곧장 여비를 구하러 나섭니다.']
            ]
          }
        ]
      },
      {
        loc: '마을 · 여비 마련',
        th: 0,
        p: 'v',
        t: '가진 돈은 15달러. 차비와 식비까지 충분할까요?',
        s: '이웃을 도우면 여비를 모을 수 있지만, 시간이 흘러 다라가 지칠 수 있어요.',
        n: [
          {
            x: 130,
            n: '할머니',
            c: GR,
            d: [
              '할머니|이거, 내가 장날 쓰려고 모아 둔 거야. 꼭 데려가거라.',
              'MAYA|할머니… 꼭 낫게 해서 돌아올게요.'
            ],
            ch: [
              ['받는다', '💰+2달러', '🤲', -2, 15, 0, '', '할머니의 마음이 손에 쥐어집니다.']
            ]
          },
          {
            x: 320,
            n: '바나 아저씨',
            c: BA,
            d: [
              '바나|마야, 수박 수레 좀 장터까지 밀어 주겠니? 병원 간다고 들었다. 품삯은 두둑이 쳐 주마.'
            ],
            ch: [
              ['수레를 민다', '💰+3달러 · 🕒+90분', '🍉', -3, 90, 0, 'neighbor', '바나 아저씨가 돈을 쥐여 줍니다. "다녀와서 다라 소식 꼭 전해 다오."'],
              NO('다음에 할게요')
            ]
          },
          {
            x: 540,
            n: '이웃 아주머니',
            c: CH,
            d: [
              '아주머니|우물에서 물 좀 길어다 줄래? 다라가 나으면 쌀 한 줌 더 보태마.'
            ],
            ch: [
              ['물을 길어 준다', '💰+2달러 · 🕒+60분', '🪣', -2, 60, 0, '', '물동이를 나르고 품삯을 받았어요.'],
              NO('다음에 할게요')
            ]

        ]
      },
      {
        loc: '마을 어귀 · 정류장',

        t: '프놈펜까지는 꼬박 하루가 걸리는 길이에요.',
        s: '남은 돈과 다라의 체력을 고려해 이동 수단을 정하세요.',
        n: [
          {
            x: 400,
            n: '정류장 기사',
            c: SE,
            m: 1,
            d: () => [
              '기사|프놈펜까지 가려고? 둘이면 차비가 꽤 들 텐데.',
              'MAYA|헤브론의료원이요. 동생이 심장이 아파서 빨리 가야 해요.'
            ].concat(F.advice ? ['기사|(메모를 보더니) 오, 소페아 선생이 적어 줬구먼. 병원 앞 골목까지 정확히 적혀 있네.'] : []),
            ch: [
              ['오토바이 택시', '💰-8달러 · 빠르지만 비싸요 (🕒+120분)', '🛵', 8, 120, 0, '', '오토바이 택시를 타고 큰길로 나섭니다.', 'motor'],

      R(x - 5, y - 78, 160, 8, '#2d7955');
      R(x + 64, y - 68, 22, 22, '#2d7955');
      R(x + 73, y - 65, 4, 16, '#fff');
      R(x + 67, y - 59, 16, 4, '#fff');
      for (const k of [14, 104]) {
        R(x + k, y - 44, 32, 20, '#9fd0e3');
        R(x + k + 15, y - 44, 2, 20, '#e9efe3');
      }
      R(x + 58, y - 28, 34, 28, '#6aa6a0');
      R(x + 74, y - 28, 2, 28, '#e9efe3');
      R(x + 52, y - 3, 46, 3, '#cfc7b0');
      g.fillStyle = '#fff';
      g.font = 'bold 7px sans-serif';
      g.fillText('HMC 20TH', x + 54, y - 71);
    }

    function cab(x) {
      R(x, GY - 50, 36, 56, '#c9b79a');
      R(x + 2, GY - 48, 32, 24, '#a9c9cf');
      R(x + 2, GY - 22, 32, 22, '#d6c6a8');
      R(x + 16, GY - 14, 4, 2, '#6b4a2f');
    }

    function sign(x) {
      R(x, 36, 22, 22, '#2d7955');
      R(x + 9, 39, 4, 16, '#fff');
      R(x + 3, 45, 16, 4, '#fff');
    }

    function bed(x) {
      R(x, FY - 14, 60, 4, '#e7ecee');
      R(x, FY - 10, 60, 8, '#6aa6a0');
      R(x - 2, FY - 22, 3, 22, '#8a6a43');
      R(x + 59, FY - 18, 3, 18, '#8a6a43');
      R(x + 3, FY - 18, 14, 5, '#fff');
    }

    function props() {
      const o = cam;
      const p = S[idx].p;
      if (p === 'v') {
        hut(120 - o);
        palm(470 - o);
        palm(700 - o);
        palm(820 - o);
      } else if (p === 'r') {
        fence();
        palm(170 - o);
        palm(640 - o);
        bus(300 - o);
      } else if (p === 'h') {
        palm(200 - o);
        palm(380 - o);
        hosp(480 - o);
        palm(780 - o);
      } else if (p === 'c') {
        cab(150 - o);
        cab(210 - o);
        sign(330 - o);
      } else {
        sign(120 - o);
        bed(355 - o);
      }
    }

    /* ---------- 배경 렌더링 (시간대에 따른 하늘 변화) ---------- */
    function skyColors(th) {
      const hr = 6 + Math.floor(mins / 60);
      if (idx <= 5) {
        if (hr >= 18) return ['#2c3e50', '#e67e22']; // 저녁 노을/밤
        if (hr >= 16) return ['#7fb3d5', '#f5b041']; // 늦은 오후
      }
      return th.sky;
    }

    function forest(par, c1, c2, sp, w, seed, h) {
      const o = cam * par;
      for (let i = Math.floor(o / sp) - 1; i <= Math.floor((o + VW) / sp) + 1; i++) {
        const r = rnd(i * 7 + seed);
        const x = Math.round(i * sp + r * sp * 0.6 - o);
        const cy = h + r * 22;
        R(x, 0, w, GY + 3, c2);
        R(x - w, cy - 6, w * 3, 8, c1);
        R(x - w * 2, cy, w * 5, 8, c1);
        R(x - w * 3, cy + 8, w * 7, 7, c1);
      }
    }

    function rays() {
      g.fillStyle = 'rgba(255, 246, 190, 0.11)';
      for (let k = 0; k < 4; k++) {
        const x = ((k * 95 - cam * 0.15 + Math.sin(T / 90 + k) * 4) % 400 + 400) % 400 - 40;
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + 26, 0);
        g.lineTo(x - 34, GY);
        g.lineTo(x - 62, GY);
        g.fill();
      }
    }

    function outdoor(th) {
      const sc = skyColors(th);
      const gr = g.createLinearGradient(0, 0, 0, GY);
      gr.addColorStop(0, sc[0]);
      gr.addColorStop(1, sc[1]);
      g.fillStyle = gr;
      g.fillRect(0, 0, VW, GY + 1);

      forest(0.25, th.far, th.ft, 70, 3, 1, 6);
      forest(0.55, th.mid, th.tr, 52, 4, 5, 14);
      rays();

      R(0, GY, VW, 6, th.gr);
      R(0, GY + 6, VW, 40, th.dt);
      for (let k = Math.floor(cam / 8); k < cam / 8 + 42; k++) {
        if (rnd(k) > 0.55) {
          R(k * 8 - cam, GY - 2, 2, 2, th.gr);
          R(k * 8 + 3 - cam, GY + 9 + rnd(k + 4) * 20, 3, 1, '#00000022');
        }
      }
    }

    function indoor(th) {
      R(0, 0, VW, GY, th.wall);
      R(0, GY - 30, VW, 30, th.wd);
      R(0, GY - 31, VW, 2, '#0002');
      R(0, GY, VW, 40, th.fl);

      for (let k = Math.floor(cam / 30); k < cam / 30 + 12; k++) {
        R(k * 30 - cam, GY, 1, 40, '#0002');
      }
      R(0, GY + 14, VW, 1, '#0002');
      R(0, GY + 28, VW, 1, '#0002');

      for (let k = 0; k < 5; k++) {
        const x = 90 + k * 210 - cam;
        if (x < -80 || x > VW) continue;
        R(x - 2, 24, 40, 50, '#8aa28f');
        R(x, 26, 36, 46, '#9fd0e3');
        R(x + 17, 26, 2, 46, '#8aa28f');
        R(x, 47, 36, 2, '#8aa28f');
        g.fillStyle = 'rgba(255, 246, 190, 0.14)';
        g.beginPath();
        g.moveTo(x, GY);
        g.lineTo(x + 36, GY);
        g.lineTo(x + 78, GY + 36);
        g.lineTo(x + 40, GY + 36);
        g.fill();
      }
    }

    /* ---------- 메인 렌더 루프 ---------- */
    function render() {
      const s = S[idx];
      const th = TH[s.th];
      const o = cam;

      th.in ? indoor(th) : outdoor(th);
      props();

      const bob = Math.round(Math.sin(T / 12) * 2);

      S[idx].n.forEach((n, i) => {
        if (n.q && !F[n.q]) return;
        if (n.j && dn[i] && F.family) return;
        if (idx === 7 && i === 0) return; // 회복실 다라는 침대 위에 별도 렌더링
        person(n.x - o, FY, n.c, px < n.x ? -1 : 1, 0);
        if (!dn[i] && mode !== 'fade') {
          R(n.x - o - 1, FY - 36 + bob, 2, 5, '#ffe58a');
          R(n.x - o - 1, FY - 29 + bob, 2, 2, '#ffe58a');
        }
      });

      // 8장 회복실: 침대 위 다라
      if (idx === 7) {
        R(362 - o, FY - 21, 8, 6, SK);
        R(362 - o, FY - 23, 8, 3, '#2a1f2d');
        if (!dn[0] && mode !== 'fade') {
          R(365 - o, FY - 34 + bob, 2, 5, '#ffe58a');
          R(365 - o, FY - 27 + bob, 2, 2, '#ffe58a');
        }
      }

      if (!riding) {
        for (const k of ['b', 'c', 'g', 'd']) {
          if (has(k)) {
            const d = px > pos[k] ? 1 : -1;
            if (k === 'g') dog(pos[k] - o, FY, d, mv);
            else if (k === 'c') person(pos[k] - o, FY, CH, d, mv);
            else kid(pos[k] - o, FY, k === 'd' ? DA : BI, d, mv);
          }
        }
        person(px - o, FY, ME, dir, mv);
      } else {
        vehicle();
      }

      S[idx].n.forEach(n => {
        if (n.ds) {
          R(n.x - 20 - o, FY - 12, 40, 3, '#8a6a43');
          R(n.x - 18 - o, FY - 9, 36, 10, '#a67c52');
        }
      });

      if (mode !== 'fade' && mode !== 'title' && !riding && open()) {
        const ax = W - 30 - o + Math.round(Math.sin(T / 8) * 2);
        g.fillStyle = 'rgba(255, 229, 138, 0.22)';
        g.fillRect(W - 24 - o, GY - 30, 24, 60);
        for (let i = 0; i < 5; i++) {
          R(ax + i * 2, FY - 44 + i, 2, 10 - 2 * i, '#ffe58a');
        }
      }

      if (!th.in) {
        for (let i = 0; i < 28; i++) {
          const x = ((rnd(i) * VW - cam * 0.5 + T * 0.05 * (1 + rnd(i + 9))) % VW + VW) % VW;
          const y = rnd(i + 3) * GY + Math.sin(T / 40 + i) * 3;
          g.fillStyle = 'rgba(255, 255, 220, ' + (0.3 + 0.4 * Math.abs(Math.sin(T / 30 + i))) + ')';
          g.fillRect(Math.round(x), Math.round(y), 1, 1);
        }
      }

      g.fillStyle = vg;
      g.fillRect(0, 0, VW, 50);

      if (fa > 0) {
        g.fillStyle = 'rgba(0, 0, 0, ' + fa + ')';
        g.fillRect(0, 0, VW, 160);
      }
    }

    /* ---------- 게임 로직 및 UI 업데이트 ---------- */
    const ok = n => !n.q || F[n.q];
    const open = () => S[idx].n.every((n, i) => !n.m || dn[i]);

    function hint(t) {
      if (t !== lastHint) {
        lastHint = t;
        $('hint').textContent = t;
      }
    }

    const has = k => {
      if (k === 'd') return idx < 6;
      if (k === 'g') return idx >= 1 && idx <= 4;
      return !!F.family && (idx === 3 || idx === 4);
    };

    function spp(nm) {
      if (nm === 'MAYA') return [riding ? vx : px, 28];
      if (nm === '다라') return idx === 7 ? [366, 24] : has('d') ? [pos.d, 20] : null;
      if (nm === '찬타' && has('c')) return [pos.c, 28];
      const L = S[idx].n;
      const n = L.find((m, i) => ok(m) && m.n.includes(nm) && !(m.j && dn[i] && F.family));
      return n ? [n.x, 28] : null;
    }

    function bubble() {
      const b = $('bub');
      const c = $('cap');
      if (!bt || choosing || mode === 'title') {
        b.style.display = 'none';
        c.style.display = 'none';
        return;
      }

      const p = spp(bs);
      if (!p) {
        if (c._k !== bt) {
          c.textContent = bt;
          c._k = bt;
        }
        c.style.display = 'block';
        b.style.display = 'none';
        return;
      }

      c.style.display = 'none';
      const k = bs + '|' + bt;
      if (b._k !== k) {
        b.innerHTML = '<b>' + bs + '</b>' + bt;
        b._k = k;
      }

      const sx = (p[0] - cam) / VW * 100;
      const L = clamp(sx, 22, 78);
      b.style.left = L + '%';
      b.style.top = (FY - p[1]) / 160 * 100 + '%';
      b.style.setProperty('--dx', (sx - L) / 100 * $('stage').clientWidth + 'px');
      b.style.display = 'block';
    }

    function hud() {
      $('m').textContent = money;
      $('h').textContent = hp;
      $('stage').classList.toggle('danger', hp <= 1);
      $('co').textContent = '동행 · ' + ([
        has('d') && '🧒 다라',
        has('g') && '🐕 콩',
        has('c') && '👩‍👦 찬타 모자'
      ].filter(Boolean).join(' · ') || '없음');

      const hh = String(6 + Math.floor(mins / 60)).padStart(2, '0');
      const mm = String(mins % 60).padStart(2, '0');
      $('c').textContent = hh + ':' + mm;
      $('steps').innerHTML = S.map((_, i) => '<i class="st ' + (i < idx ? 'd' : i === idx ? 'a' : '') + '"></i>').join('');
    }

    function load() {
      const s = S[idx];
      px = 40;
      cam = 0;
      bt = '';
      dn = s.n.map(() => 0);
      for (const k in OFF) pos[k] = px - OFF[k];
      riding = false;
      chT = 0;
      cur = -1;
      choosing = 0;

      $('loc').textContent = '📍 ' + s.loc;
      $('sp').textContent = warn ? '⚠️ 다라의 상태' : '목표';
      $('tt').textContent = warn || s.t;
      $('st2').textContent = s.s;
      $('ch').innerHTML = '';
      warn = '';
      lastHint = '';
      hud();
    }

    function say(l) {
      const p = l.includes('|') ? l.split('|') : ['결과', l];
      bs = p[0];
      bt = p.slice(1).join('|');
      $('ch').innerHTML = '';
      sfx('talk');
      hint('[E] / [Space] / ✋ 버튼 · 화면을 눌러 계속');
    }

    function talk(i) {
      const n = S[idx].n[i];
      cur = i;
      q = (typeof n.d === 'function' ? n.d() : n.d).slice();
      qi = 0;
      mode = 'talk';
      after = () => (n.ch ? choices() : endTalk());
      say(q[0]);
    }

    function adv() {
      qi++;
      if (qi < q.length) say(q[qi]);
      else after();
    }

    function endTalk() {
      const n = S[idx].n[cur];
      dn[cur] = 1;
      if (n.s) F[n.s] = 1;
      mode = 'walk';
      cur = -1;
      bt = '';
      lastHint = '';
      hud();
    }

    function choices() {
      const n = S[idx].n[cur];
      vis = n.ch.filter(c => (!c[9] || F[c[9]]) && !(c[10] && F[c[6]]));
      $('ch').innerHTML = vis.map((c, i) => {
        const afford = c[3] <= 0 || money >= c[3];
        const sub = afford ? c[1] : c[1] + ' (잔액 부족: 💰' + money + '달러)';
        return (
          '<button class="c" data-i="' + i + '" ' + (afford ? '' : 'disabled') + '>' +
          '<span class="i">' + c[2] + '</span>' +
          '<span><b>' + c[0] + '</b><small>' + sub + '</small></span>' +
          '</button>'
        );
      }).join('');
      choosing = 1;
      bt = '';
      hint('선택하세요 (1~4 키 또는 터치)');
    }

    function pick(i) {
      const c = vis[i];
      if (!choosing || !c) return;
      if (c[3] > 0 && money < c[3]) {
        sfx('warn');
        return;
      }

      choosing = 0;
      sfx('pick');
      const n = S[idx].n[cur];

      money = Math.max(0, money - c[3]);
      mins += c[4];
      chT += c[4];
      hp = clamp(hp + c[5], 0, 5);

      if (c[6]) F[c[6]] = 1;
      if (c[6] === 'family') {
        pos.c = n.x;
        pos.b = n.x + 16;
      }
      if (c[8]) tr = c[8];
      hud();

      const ride = c[8] === 'motor' || c[8] === 'bus';
      let extra = [];
      if (hp <= 1 && c[5] < 0) {
        extra.push('다라|누나… 다리에 힘이 안 들어가…');
      }

      q = [c[7].includes('|') ? c[7] : '결과|' + c[7]].concat(extra, c[10] ? [] : n.af || []);
      qi = 0;

      after = c[10]
        ? choices
        : () => {
            endTalk();
            if (ride) {
              mode = 'ride';
              riding = true;
              vx = px;
              vk = c[8];
              vsp = vk === 'motor' ? 2.6 : 1.8;
              hint('이동 중…');
            }
          };
      say(q[0]);
    }

    function near() {
      let b = -1, bd = 32;
      S[idx].n.forEach((m, i) => {
        const d = Math.abs(px - m.x);
        if (!dn[i] && ok(m) && d < bd) {
          bd = d;
          b = i;
        }
      });
      return b;
    }

    function act() {
      if (mode === 'walk') {
        const i = near();
        if (i >= 0) talk(i);
      } else if (mode === 'talk' && !choosing) {
        adv();
      }
    }

    function leave() {
      if (mode === 'fade' || mode === 'end') return;
      if (idx === S.length - 1) {
        mode = 'end';
        finish();
        return;
      }
      if (idx === 1 && chT >= 150) {
        hp = Math.max(1, hp - 1);
        warn = '여비를 모으느라 시간이 지체되어 다라의 숨이 더 거칠어졌어요…';
        sfx('warn');
      }
      mode = 'fade';
      fa = 0;
      fdir = 1;
    }

    function update(dt) {
      T += dt;
      if (mode === 'walk') {
        const v = (K.r - K.l) * 1.6 * dt;
        mv = v !== 0;
        if (v) {
          px = clamp(px + v, 12, W - 12);
          dir = v > 0 ? 1 : -1;
        }
        const i = near();
        hint(
          i >= 0
            ? '💬 [E] / [Space] / ✋ 버튼: ' + S[idx].n[i].n + '에게 말 걸기'
            : open()
              ? '→ 오른쪽 끝으로 이동해 다음 장소로 가세요'
              : '← → 로 걸어 사람들에게 다가가세요'
        );
        if (open() && px >= W - 26) leave();
      } else {
        mv = 0;
      }

      if (mode === 'ride') {
        vx += vsp * dt;
        if (vx > W + 40) leave();
      }

      cam += (clamp((riding ? vx : px) - VW / 2, 0, W - VW) - cam) * Math.min(1, 0.12 * dt);

      for (const k in OFF) {
        pos[k] += (px - dir * OFF[k] - pos[k]) * Math.min(1, RT[k] * dt);
      }

      if (mode === 'fade') {
        fa += 0.035 * dt * fdir;
        if (fdir > 0 && fa >= 1) {
          fa = 1;
          idx++;
          load();
          fdir = -1;
        } else if (fdir < 0 && fa <= 0) {
          fa = 0;
          mode = 'walk';
        }
      }
    }

    /* ---------- 오버레이 및 엔딩 ---------- */
    function ov(e, t, x, qt, b, fn, st) {
      $('ee').textContent = e;
      $('et').textContent = t;
      $('ex').textContent = x;
      $('eq').textContent = qt;
      $('eq').style.display = qt ? '' : 'none';
      $('stats').innerHTML = st || '';
      $('stats').style.display = st ? 'block' : 'none';
      $('re').textContent = b;
      ovFn = fn;
      $('end').classList.add('show');
    }

    function showTitle() {
      load();
      ov(
        '🌿',
        '생명을 향한 여정',
        '← → 로 걸어 다니고 E · Space(모바일은 ✋ 버튼)로 말을 겁니다. 선택은 1~4 키 또는 터치로 합니다.',
        '헤브론의료원 개원 20주년 · 인터랙티브 스토리',
        '여정 시작하기',
        () => {
          sfx('pick');
          mode = 'walk';
        }
      );
    }

    function reset() {
      clearTimeout(idleT);
      idx = 0;
      money = 15;
      mins = 0;
      hp = 5;
      F = {};
      tr = '';
      warn = '';
      mode = 'title';
      fa = 0;
      showTitle();
    }

    function finish() {
      sfx('end');
      const E = [
        ['🌧️', '아직 끝나지 않은 길', '거리와 비용의 벽 앞에서 다라는 겨우 버텨냈고, 퇴원 이후의 재방문도 기약하지 못했습니다.', '병원이 있다는 것과, 누구나 갈 수 있다는 것은 다릅니다.'],
        ['🧭', '늦었지만 이어진 길', '먼 길을 돌아왔고 다라도 많이 지쳤지만, 정기 검진을 약속하며 치료의 끈을 놓지 않았습니다.', '아픈 사람이 치료를 포기하지 않도록, 의료가 필요한 곳에 닿아야 합니다.'],
        ['🌿', '가까스로 닿은 길', '무사히 수술을 마쳤지만, 먼 거리와 차비 부담 때문에 이후 돌봄은 숙제로 남았습니다.', '의료 접근성은 병원이 있는 것만으로 완성되지 않습니다.'],
        ['🌱', '생명으로 이어지는 길', '한 번의 수술로 끝나지 않고, 병원과 마을이 함께 돌보는 회복의 길이 이어졌습니다.', '가까운 곳에서 필요한 의료를 받을 수 있다는 것. 누군가에게는 당연하지만, 누군가에게는 간절한 바람입니다.']
      ][(hp >= 3 ? 2 : 0) + (F.followup ? 1 : 0)];

      const bonds = [
        F.advice && '📝 길 안내 메모',
        F.neighbor && '🏍️ 바나 아저씨의 도움',
        F.family && '👩‍👦 찬타 모자 동행',
        F.support && '🤝 사회사업 후원 연계',
        F.followup && '📅 정기 재방문 등록'
      ].filter(Boolean);

      const stHtml =
        `<b>여정 기록</b> · 총 소요 시간 ${Math.floor(mins / 60)}시간 ${mins % 60}분 | 남은 여비 💰 ${money}달러 | 다라 건강 ❤️ ${hp}/5<br>` +
        `<b>맺은 인연과 준비</b> · ${bonds.length ? bonds.join(' · ') : '홀로 버텨낸 여정'}`;

      ov(
        E[0],
        E[1],
        E[2] + ' 헤브론의료원 20주년, 그리고 다음 20년.',
        E[3],
        '처음부터 다시하기',
        reset,
        stHtml
      );
      idleT = setTimeout(reset, 90000);
    }

    /* ---------- 이벤트 리스너 ---------- */
    $('re').onclick = () => {
      clearTimeout(idleT);
      $('end').classList.remove('show');
      if (ovFn) ovFn();
    };

    $('box').addEventListener('click', e => {
      if (!e.target.closest('.c')) act();
    });

    $('stage').addEventListener('click', e => {
      if (!e.target.closest('#pad') && !e.target.closest('#snd') && mode === 'talk' && !choosing) {
        adv();
      }
    });

    addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') K.l = 1;
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') K.r = 1;
      else if ((k === 'e' || k === 'E' || k === ' ' || k === 'Enter') && !e.repeat) {
        act();
        e.preventDefault();
      } else if (k >= '1' && k <= '4') {
        pick(+k - 1);
      }
    });

    addEventListener('keyup', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') K.l = 0;
      if (k === 'ArrowRight' || k === 'd' || k === 'D') K.r = 0;
    });

    $('ch').addEventListener('click', e => {
      const b = e.target.closest('.c');
      if (b && !b.disabled) pick(+b.dataset.i);
    });

    function hold(id, key) {
      const b = $(id);
      const on = e => {
        e.preventDefault();
        K[key] = 1;
      };
      const off = () => {
        K[key] = 0;
      };
      b.addEventListener('pointerdown', on);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => b.addEventListener(n, off));
    }

    hold('L', 'l');
    hold('R', 'r');
    $('A').addEventListener('pointerdown', e => {
      e.preventDefault();
      act();
    });

    addEventListener('blur', () => {
      K.l = 0;
      K.r = 0;
    });

    /* ---------- 시작 ---------- */
    showTitle();
    let last = performance.now();
    (function loop(now) {
      const dt = Math.min(3, (now - last) / 16.67);
      last = now;
      update(dt);
      render();
      bubble();
      requestAnimationFrame(loop);
    })(last);
  </script>
</body>
</html>
