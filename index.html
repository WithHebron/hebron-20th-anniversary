 R(x-5,y-7,10,5,'#b98b55');R(hx,y-10,5,5,'#b98b55');R(hx+(d>0?0:3),y-10,2,4,'#7a5632');R(d>0?hx+3:hx+1,y-8,1,1,'#222');
 R(tx,y-9-f,3,3,'#b98b55');R(x-4,y-2,2,2,'#7a5632');R(x+2,y-2,2,2,'#7a5632')}
function vehicle(){const x=Math.round(vx-cam),y=FY;
 if(vk=='motor'){person(x,y-4,ME,1,0);R(x-12,y-9,24,4,'#c0392b');R(x-14,y-5,8,8,'#222');R(x+7,y-5,8,8,'#222');R(x+5,y-14,3,6,'#555')}
 else{R(x-34,y-30,68,28,'#e8b930');R(x-34,y-12,68,3,'#c0392b');for(let k=0;k<5;k++)R(x-30+k*13,y-26,10,9,'#9fd0e3');R(x-26,y-5,10,8,'#222');R(x+16,y-5,10,8,'#222')}}

/* ---------- 배경 소품 ---------- */
function hut(x){const y=GY+4;R(x,y-24,44,24,'#b08a5c');for(let i=0;i<9;i++)R(x-8+i*2,y-26-i*2,60-i*4,2,i%2?'#6b8e3a':'#7da048');R(x+17,y-15,9,15,'#5a3d28');R(x+4,y-17,8,7,'#9fd0e3');R(x+32,y-17,8,7,'#9fd0e3')}
function palm(x){R(x,GY-36,4,42,'#7d5e3d');R(x-12,GY-40,14,3,'#4c8a3c');R(x+3,GY-40,14,3,'#4c8a3c');R(x-8,GY-44,20,3,'#5ea84a');R(x-3,GY-48,10,3,'#5ea84a');R(x-14,GY-37,5,3,'#4c8a3c');R(x+9,GY-37,5,3,'#4c8a3c')}
function fence(){for(let k=0;k<W/24;k++)R(k*24-cam,GY-12,3,16,'#7d5e3d');R(-cam,GY-9,W,2,'#9a7a52');R(-cam,GY-3,W,2,'#9a7a52')}
function bus(x){R(x,GY-38,3,44,'#666');R(x-14,GY-40,32,5,'#c0392b');R(x+8,GY-6,22,3,'#8a6a43');R(x+9,GY-3,2,8,'#6b4a2f');R(x+27,GY-3,2,8,'#6b4a2f')}
function hosp(x){const y=GY+5;R(x,y-72,150,72,'#f3f0e4');R(x-5,y-78,160,8,'#2d7955');R(x+64,y-68,22,22,'#2d7955');R(x+73,y-65,4,16,'#fff');R(x+67,y-59,16,4,'#fff');
 for(const k of[14,104]){R(x+k,y-44,32,20,'#9fd0e3');R(x+k+15,y-44,2,20,'#e9efe3')}R(x+58,y-28,34,28,'#6aa6a0');R(x+74,y-28,2,28,'#e9efe3');R(x+52,y-3,46,3,'#cfc7b0');g.fillStyle='#fff';g.font='bold 7px sans-serif';g.fillText('HMC 20TH',x+54,y-71)}
function cab(x){R(x,GY-50,36,56,'#c9b79a');R(x+2,GY-48,32,24,'#a9c9cf');R(x+2,GY-22,32,22,'#d6c6a8');R(x+16,GY-14,4,2,'#6b4a2f')}
function sign(x){R(x,36,22,22,'#2d7955');R(x+9,39,4,16,'#fff');R(x+3,45,16,4,'#fff')}
function bed(x){R(x,FY-14,60,4,'#e7ecee');R(x,FY-10,60,8,'#6aa6a0');R(x-2,FY-22,3,22,'#8a6a43');R(x+59,FY-18,3,18,'#8a6a43');R(x+3,FY-18,14,5,'#fff')}
function props(){const o=cam,p=S[idx].p;
 if(p=='v'){hut(120-o);palm(470-o);palm(700-o);palm(820-o)}
 else if(p=='r'){fence();palm(170-o);palm(640-o);bus(300-o)}
 else if(p=='h'){palm(200-o);palm(380-o);hosp(480-o);palm(780-o)}
 else if(p=='c'){cab(150-o);cab(210-o);sign(330-o)}
 else{sign(120-o);bed(320-o)}}

/* ---------- 배경 ---------- */
function forest(par,c1,c2,sp,w,seed,h){const o=cam*par;
 for(let i=Math.floor(o/sp)-1;i<=Math.floor((o+VW)/sp)+1;i++){const r=rnd(i*7+seed),x=Math.round(i*sp+r*sp*.6-o),cy=h+r*22;
  R(x,0,w,GY+3,c2);R(x-w,cy-6,w*3,8,c1);R(x-w*2,cy,w*5,8,c1);R(x-w*3,cy+8,w*7,7,c1)}}
function rays(){g.fillStyle='rgba(255,246,190,.11)';
 for(let k=0;k<4;k++){const x=((k*95-cam*.15+Math.sin(T/90+k)*4)%400+400)%400-40;g.beginPath();g.moveTo(x,0);g.lineTo(x+26,0);g.lineTo(x-34,GY);g.lineTo(x-62,GY);g.fill()}}
function outdoor(th){const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,th.sky[0]);gr.addColorStop(1,th.sky[1]);g.fillStyle=gr;g.fillRect(0,0,VW,GY+1);
 forest(.25,th.far,th.ft,70,3,1,6);forest(.55,th.mid,th.tr,52,4,5,14);rays();
 R(0,GY,VW,6,th.gr);R(0,GY+6,VW,40,th.dt);
 for(let k=Math.floor(cam/8);k<cam/8+42;k++)if(rnd(k)>.55){R(k*8-cam,GY-2,2,2,th.gr);R(k*8+3-cam,GY+9+rnd(k+4)*20,3,1,'#00000022')}}
function indoor(th){R(0,0,VW,GY,th.wall);R(0,GY-30,VW,30,th.wd);R(0,GY-31,VW,2,'#0002');
 R(0,GY,VW,40,th.fl);for(let k=Math.floor(cam/30);k<cam/30+12;k++)R(k*30-cam,GY,1,40,'#0002');R(0,GY+14,VW,1,'#0002');R(0,GY+28,VW,1,'#0002');
 for(let k=0;k<5;k++){const x=90+k*210-cam;if(x<-80||x>VW)continue;
  R(x-2,24,40,50,'#8aa28f');R(x,26,36,46,'#9fd0e3');R(x+17,26,2,46,'#8aa28f');R(x,47,36,2,'#8aa28f');
  g.fillStyle='rgba(255,246,190,.14)';g.beginPath();g.moveTo(x,GY);g.lineTo(x+36,GY);g.lineTo(x+78,GY+36);g.lineTo(x+40,GY+36);g.fill()}}

/* ---------- 렌더 ---------- */
function render(){const s=S[idx],th=TH[s.th],o=cam;
 th.in?indoor(th):outdoor(th);props();
 const bob=Math.round(Math.sin(T/12)*2);
 S[idx].n.forEach((n,i)=>{if(n.q&&!F[n.q])return;person(n.x-o,FY,n.c,px<n.x?-1:1,0);if(!dn[i]&&mode!='fade'){R(n.x-o-1,FY-36+bob,2,5,'#ffe58a');R(n.x-o-1,FY-29+bob,2,2,'#ffe58a')}});
 if(!riding){if(idx>0)dog(fx-o,FY,px>fx?1:-1,Math.abs(px-fx)>24&&mv);person(px-o,FY,ME,dir,mv)}else vehicle();
 S[idx].n.forEach(n=>{if(n.ds){R(n.x-20-o,FY-12,40,3,'#8a6a43');R(n.x-18-o,FY-9,36,10,'#a67c52')}});
 if(mode!='fade'&&mode!='title'&&!riding&&open()){const ax=W-30-o+Math.round(Math.sin(T/8)*2);g.fillStyle='rgba(255,229,138,.18)';g.fillRect(W-24-o,GY-30,24,60);for(let i=0;i<5;i++)R(ax+i*2,FY-44+i,2,10-2*i,'#ffe58a')}
 if(!th.in)for(let i=0;i<28;i++){const x=((rnd(i)*VW-cam*.5+T*.05*(1+rnd(i+9)))%VW+VW)%VW,y=rnd(i+3)*GY+Math.sin(T/40+i)*3;g.fillStyle='rgba(255,255,220,'+(.3+.4*Math.abs(Math.sin(T/30+i)))+')';g.fillRect(Math.round(x),Math.round(y),1,1)}
 g.fillStyle=vg;g.fillRect(0,0,VW,50);
 if(fa>0){g.fillStyle='rgba(0,0,0,'+fa+')';g.fillRect(0,0,VW,160)}}

/* ---------- 로직 ---------- */
const ok=n=>!n.q||F[n.q],open=()=>S[idx].n.every((n,i)=>!n.m||dn[i]);
function hint(t){if(t!==lastHint){lastHint=t;$('hint').textContent=t}}
function hud(){$('m').textContent=money;$('h').textContent=hp;$('c').textContent=String(8+Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
 $('steps').innerHTML=S.map((_,i)=>'<i class="st '+(i<idx?'d':i==idx?'a':'')+'"></i>').join('')}
function load(){const s=S[idx];px=40;cam=0;fx=20;dn=s.n.map(()=>0);riding=false;chT=0;cur=-1;choosing=0;
 $('loc').textContent='📍 '+s.loc;$('sp').textContent=warn?'다라':'MAYA';$('tt').textContent=warn||s.t;$('st2').textContent=s.s;$('ch').innerHTML='';warn='';lastHint='';hud()}
function say(l){const p=l.includes('|')?l.split('|'):['결과',l];$('sp').textContent=p[0];$('tt').textContent=p.slice(1).join('|');$('st2').textContent='';$('ch').innerHTML='';hint('[E] / [Space] / ✋ 버튼 · 화면을 눌러 계속')}
function talk(i){const n=S[idx].n[i];cur=i;q=(typeof n.d=='function'?n.d():n.d).slice();qi=0;mode='talk';after=()=>n.ch?choices():endTalk();say(q[0])}
function adv(){qi++;if(qi<q.length)say(q[qi]);else after()}
function endTalk(){const n=S[idx].n[cur];dn[cur]=1;if(n.s)F[n.s]=1;mode='walk';cur=-1;lastHint='';hud()}
function choices(){const n=S[idx].n[cur];vis=n.ch.filter(c=>(!c[9]||F[c[9]])&&!(c[10]&&F[c[6]]));
 $('ch').innerHTML=vis.map((c,i)=>'<button class="c" data-i="'+i+'"><span class="i">'+c[2]+'</span><span><b>'+c[0]+'</b><small>'+c[1]+'</small></span></button>').join('');choosing=1;hint('선택하세요 (1~4 키 또는 터치)')}
function pick(i){const c=vis[i];if(!choosing||!c)return;choosing=0;const n=S[idx].n[cur];
 money=Math.max(0,money-c[3]);mins+=c[4];chT+=c[4];hp=clamp(hp+c[5],0,5);if(c[6])F[c[6]]=1;if(c[8])tr=c[8];hud();
 const ride=c[8]=='motor'||c[8]=='bus';
 q=[c[7].includes('|')?c[7]:'결과|'+c[7]].concat(c[10]?[]:n.af||[]);qi=0;
 after=c[10]?choices:()=>{endTalk();if(ride){mode='ride';riding=true;vx=px;vk=c[8];vsp=vk=='motor'?2.6:1.8;hint('이동 중…')}};say(q[0])}
function near(){let b=-1,bd=30;S[idx].n.forEach((m,i)=>{const d=Math.abs(px-m.x);if(!dn[i]&&ok(m)&&d<bd){bd=d;b=i}});return b}
function act(){if(mode=='walk'){const i=near();if(i>=0)talk(i)}else if(mode=='talk'&&!choosing)adv()}
function leave(){if(mode=='fade'||mode=='end')return;if(idx==S.length-1){mode='end';finish();return}
 if(idx==1&&chT>=6){hp=Math.max(0,hp-1);warn='다라의 숨이 더 거칠어졌어요…'}mode='fade';fa=0;fdir=1}
function update(dt){T+=dt;
 if(mode=='walk'){const v=(K.r-K.l)*1.5*dt;mv=v!=0;if(v){px=clamp(px+v,12,W-12);dir=v>0?1:-1}
  const i=near();hint(i>=0?'💬 [E] / [Space] / ✋ 버튼: '+S[idx].n[i].n+'에게 말 걸기':open()?'→ 오른쪽 끝으로 이동해 다음 장소로 가세요':'← → 로 걸어 사람들에게 다가가세요');
  if(open()&&px>=W-26)leave()}
 else mv=0;
 if(mode=='ride'){vx+=vsp*dt;if(vx>W+40)leave()}
 cam+=(clamp((riding?vx:px)-VW/2,0,W-VW)-cam)*Math.min(1,.12*dt);
 fx+=(px-dir*18-fx)*Math.min(1,.06*dt);
 if(mode=='fade'){fa+=.035*dt*fdir;if(fdir>0&&fa>=1){fa=1;idx++;load();fdir=-1}else if(fdir<0&&fa<=0){fa=0;mode='walk'}}}
function ov(e,t,x,qt,b,fn){$('ee').textContent=e;$('et').textContent=t;$('ex').textContent=x;$('eq').textContent=qt;$('eq').style.display=qt?'':'none';$('re').textContent=b;ovFn=fn;$('end').classList.add('show')}
function showTitle(){load();ov('🌿','생명을 향한 여정','← → 로 걸어 다니고 E · Space(모바일은 ✋ 버튼)로 말을 겁니다. 선택은 1~4 키 또는 터치로 합니다.','헤브론의료원 개원 20주년','시작하기',()=>{mode='walk'})}
function reset(){clearTimeout(idleT);idx=0;money=15;mins=0;hp=5;F={};tr='';warn='';mode='title';fa=0;showTitle()}
function finish(){const E=[['🌧️','아직 끝나지 않은 길','거리와 비용은 병원에 도착하기 전부터 치료 이후까지 부담이 될 수 있습니다.','병원이 있다는 것과, 누구나 갈 수 있다는 것은 다릅니다.'],
 ['🧭','늦었지만 닿은 길','먼 길을 돌아왔지만, 다라는 끝까지 치료를 이어갔습니다.','아픈 사람이 치료를 포기하지 않도록, 의료가 필요한 곳에 닿아야 합니다.'],
 ['🌿','가까스로 닿은 길','치료는 받았지만, 거리와 비용은 이후에도 부담으로 남았습니다.','의료 접근성은 병원이 있는 것만으로 완성되지 않습니다.'],
 ['🌱','이어지는 길','한 번의 치료가 아니라, 돌아오는 길이 이어졌습니다.','가까운 곳에서 필요한 의료를 받을 수 있다는 것. 누군가에게는 당연하지만, 누군가에게는 간절한 바람입니다.']][(hp>=3?2:0)+(F.followup?1:0)];
 ov(E[0],E[1],E[2]+' 헤브론의료원 20주년, 그리고 다음 20년.',E[3],'처음부터 다시하기',reset);idleT=setTimeout(reset,90000)}
$('re').onclick=()=>{clearTimeout(idleT);$('end').classList.remove('show');if(ovFn)ovFn()};
$('box').addEventListener('click',e=>{if(!e.target.closest('.c'))act()});

/* ---------- 입력 ---------- */
addEventListener('keydown',e=>{const k=e.key;
 if(k=='ArrowLeft'||k=='a'||k=='A')K.l=1;else if(k=='ArrowRight'||k=='d'||k=='D')K.r=1;
 else if((k=='e'||k=='E'||k==' '||k=='Enter')&&!e.repeat){act();e.preventDefault()}
 else if(k>='1'&&k<='4')pick(+k-1)});
addEventListener('keyup',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a'||k=='A')K.l=0;if(k=='ArrowRight'||k=='d'||k=='D')K.r=0});
$('ch').addEventListener('click',e=>{const b=e.target.closest('.c');if(b)pick(+b.dataset.i)});
function hold(id,key){const b=$(id),on=e=>{e.preventDefault();K[key]=1},off=()=>{K[key]=0};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off))}
hold('L','l');hold('R','r');$('A').addEventListener('pointerdown',e=>{e.preventDefault();act()});
addEventListener('blur',()=>{K.l=K.r=0});

showTitle();
let last=performance.now();
(function loop(now){const dt=Math.min(3,(now-last)/16.67);last=now;update(dt);render();requestAnimationFrame(loop)})(last);
</script>
